name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: file:./prisma/test.db
  JWT_SECRET: test-secret-with-at-least-32-characters-x
  RATE_LIMIT_MAX: 100
  RATE_LIMIT_WINDOW: 1 minute

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test-functional:
    name: Functional and GraphQL
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Functional REST
        run: npm run test:functional

      - name: GraphQL
        run: npm run test:graphql

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-functional
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  test-schema-security:
    name: Schema and security
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Schema (OpenAPI)
        run: npm run test:schema

      - name: Security
        run: npm run test:security

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-schema-security
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  test-coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-functional, test-schema-security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Vitest with coverage
        run: npx vitest run --coverage --reporter=default

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30

      - name: Coverage summary in the job
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            node -e "const s=require('./coverage/coverage-summary.json').total;\
              const r=(k)=>s[k].pct.toFixed(2)+'%';\
              console.log('| Metric | Pct |\n|---|---|\n| Lines | '+r('lines')+' |\n| Stmts | '+r('statements')+' |\n| Funcs | '+r('functions')+' |\n| Branch | '+r('branches')+' |');" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  build-prod:
    name: Production build and binary smoke
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run api:build

      - name: Apply migrations to the smoke database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./prisma/smoke.db

      - name: Start the built binary in the background
        run: |
          DATABASE_URL=file:./prisma/smoke.db NODE_ENV=production \
            node dist/api/server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ready > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          cat server.log
          exit 1

      - name: Smoke endpoints
        run: |
          curl -fsS http://localhost:3000/health | tee /dev/stderr
          curl -fsS http://localhost:3000/ready | tee /dev/stderr
          curl -fsS http://localhost:3000/metrics | head -5

      - name: Stop the binary
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill -TERM "$(cat server.pid)" || true
          fi

      - name: Upload dist as artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dist-prod
          path: dist
          retention-days: 7

  docker-build:
    name: Docker build multi-arch
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build alpine for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: api-testing-framework:ci

      - name: Build distroless for amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-distroless
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: api-testing-framework:distroless

  perf-smoke:
    name: Performance smoke (k6)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start API via docker compose
        run: docker compose -f docker/docker-compose.yml up -d --build api

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 2
          done
          echo "API did not start" >&2
          docker compose -f docker/docker-compose.yml logs api
          exit 1

      - name: k6 smoke
        env:
          API_BASE_URL: http://localhost:3000
        run: npm run test:perf:smoke

      - name: API logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs api

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
